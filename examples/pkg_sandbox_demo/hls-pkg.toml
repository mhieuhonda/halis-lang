[package]
name = "pkg_sandbox_demo"
version = "0.1.0"

[dependencies]
sandbox_lib = { path = "examples/pkg_sandbox_demo/libs/sandbox_lib/main.hls" }

[effects]
allowed = ["IO", "Fs", "Clock"]

# The Stage 110 section: the package's own posture, pinned beside
# the effect contract. fs = "ro" states what the release statement
# carries — the entry reads (read_file through the lib) and never
# writes. deny removes process creation outright: the surface has
# no Proc today, and this pin is what keeps a future dependency
# from growing it silently — the kernel holds the line the census
# drew. default = "errno" is the observable posture (a denial is a
# value, not a corpse).
[sandbox]
default = "errno"
fs = "ro"
deny = ["clone", "fork", "vfork"]

# hls-pkg.toml — the Stage 134 acceptance gate's real-world package.
#
# This is a REAL package in exactly the layout hls-pkg lays a
# downloaded dependency out (cache/<name>/<repo-hash>/), written in
# real Halis, harvested by the real tool. Its modules deliberately
# span the seedable surface (structs + methods, enums + match,
# recursion, list and float params) AND the named refusal surface (a
# world-effect declaration, an imported module function, a custom
# struct parameter, a parse error, a guaranteed hang, a guaranteed
# panic, a comment-twin for the identity law) — so the gate can pin
# every law of the seeder against known ground truth.

[package]
name = "fuzzseed.demo"
version = "0.1.0"
authors = ["Halis gate <gate@halis.example>"]
description = "The Stage 134 seeding fixture package"

[effects]
allowed = []

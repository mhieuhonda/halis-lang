# ============================================================================
# Release drafter — Hieu Louis (HLS)
# ----------------------------------------------------------------------------
# Automatically categorises commits merged into main into a draft GitHub
# Release whenever a new tag v* is pushed. Maintainers then edit/publish.
# ----------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build artifacts + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the full test suite
        run: make test

      - name: Bootstrap native compiler
        run: make bootstrap

      - name: Package source distribution
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='__pycache__' \
              --exclude='bin' --exclude='dist' \
              -czf dist/hls-src-${GITHUB_REF_NAME}.tar.gz .
          tar --exclude='.git' --exclude='__pycache__' \
              --exclude='bin' --exclude='dist' \
              -czf dist/hls-stdlib-${GITHUB_REF_NAME}.tar.gz std examples

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hls-src-${{ github.ref_name }}.tar.gz
            dist/hls-stdlib-${{ github.ref_name }}.tar.gz
          body: |
            ## Hieu Louis (HLS) ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/mhieuhonda/hieu-louis-lang/blob/main/CHANGELOG.md)
            for a full list of changes. See [ROADMAP.md](https://github.com/mhieuhonda/hieu-louis-lang/blob/main/ROADMAP.md)
            for the 20-stage plan to v1.0.

            ### Quick start
            ```bash
            tar xzf hls-src-${{ github.ref_name }}.tar.gz
            cd hieu-louis-lang
            make bootstrap   # build native compiler
            make test        # 78 tests, all should pass
            ```

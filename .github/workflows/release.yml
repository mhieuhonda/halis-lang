# ============================================================================
# Release — build the native Halis toolchain for 6 platforms and
# publish it.
# ============================================================================
#
# Triggers
#   * push of ANY version tag (`v*`) — the tag's SHAPE picks the
#     channel (the law lives in the `channel` step below, once):
#
#       v0.162.0          -> STABLE     — a full GitHub Release,
#                                       marked latest
#       v0.162.0-alpha    -> PRE-RELEASE — suffixed tags are the
#       v0.162.0-beta.1                pre-release channels: ANY
#       v0.162.0-rc.1                   suffix (-alpha, -beta, -rc,
#       v0.162.0-whatever               -nightly, ...), not one
#                                       blessed word — a hyphen is
#                                       a hyphen
#     -> full pipeline: 6 platform builds + SHA256SUMS + the GitHub
#        Release on the channel the tag named.
#   * workflow_dispatch (manual run from the Actions tab / `gh workflow run`)
#       -> the same 6 builds, artifacts only; NO release is created.
#          Use this to exercise the pipeline without publishing anything.
#
# Per-platform job (matrix of 6):
#   1. Compile the committed C snapshot (Stage 142, v0.161.0-alpha):
#      cc -O2 -o bin/hlc snapshot/hlc.c — NO Python on the build path;
#      the snapshot is the compiler's own emission for src/hlc.hls,
#      carried in the tree and content-addressed by
#      snapshot/MANIFEST.json.
#   2. Build the formatter the same self-hosted way `make bin/hlfmt`
#      does: the fresh compiler compiles tools/hlfmt.hls, cc links
#      bin/hlfmt — no Python anywhere on that path either.
#   3. Bootstrap-invariant re-check, run on EVERY build including cache
#      hits: the native compiler must re-derive the snapshot byte for
#      byte (the fixed-point law: bin/hlc compiles src/hlc.hls and the
#      output is diffed against the COMMITTED snapshot/hlc.c),
#      examples/hello.hls must compile and run end-to-end with the
#      expected output, and the formatter must answer over that same
#      file with byte-identical output (the tree keeps it canonical).
#   4. Package the WHOLE toolchain into a per-platform archive
#      (.tar.gz on Linux/macOS, .zip on Windows): bin/hlc, bin/hlfmt,
#      std/ and core/ (the library, as source — the only form the
#      compiler reads), examples/hello.hls, LICENSE, README.md and a
#      VERSION record. Everything an install needs, nothing it does
#      not — a user unpacks one archive and has the language. The
#      archive is uploaded as a workflow artifact named `pkg-<platform>`.
#
# The final `release` job (tag builds only) collects the six archives,
# writes SHA256SUMS over them, verifies it, and publishes the GitHub
# Release on the tag's channel — pre-release for ANY suffixed tag,
# stable-and-latest for a bare version — with every archive +
# SHA256SUMS attached.
#
# Cache
#   `bin/` (the native compiler AND the native formatter) is cached
#   per platform, keyed on the exact content hash of snapshot/** +
#   tools/hlfmt.hls + std/** + core/**. A hit proves these very
#   sources were compiled before, so the build steps are skipped
#   entirely: re-runs, retries and re-pushes of the same tag never
#   pay the compile again. No restore-keys are used on purpose — a
#   stale toolchain must never be reused for a release, and the
#   verify step (the fixed-point law) always runs regardless of
#   cache state.
#
# Toolchain notes
#   * All 6 jobs build NATIVELY on GitHub-hosted runners (public repo:
#     ubuntu-24.04-arm / windows-11-arm / macos-15-intel are free).
#   * The Linux legs link STATICALLY (-static): a binary that owes the
#     build runner's glibc nothing runs on any Linux — old Debian and
#     RHEL, musl (Alpine), NixOS — the same archive everywhere. The
#     macOS legs pin -mmacosx-version-min=11.0 for the same reason one
#     floor down: the SDK's calls are stdio/pthread/malloc, all of
#     them decades older than that floor.
#   * Windows uses MSYS2 MinGW-w64 (winpthreads): the generated C runtime
#     is pthreads-based, so MSVC is not an option; -lm -pthread behave as
#     on the Makefile's gcc invocation.
#   * libcurl is intentionally NOT installed: the Makefile auto-probes it
#     and would otherwise produce an inconsistent feature set (TLS on
#     Linux only). Without it every binary behaves identically —
#     net_tls_get panics with a clear message, everything else works.
#
# ── STAGE 143 (the self-hosted release) ────────────────────────────────────
# Since Stage 142 the release build path is pure HLS + cc: every
# platform compiles the committed C snapshot and re-proves the fixed
# point — no interpreter, no previous-release fetch, no network
# beyond the checkout. Stage 143 closes the loop around the release
# itself: the snapshot lifecycle guarding these binaries is guarded
# by tools/hls-snap.hls — the kit written in Halis, built by the
# compiler it guards.
# ────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux ------------------------------------------------------
          # linkflags: shipped binaries must not inherit the build
          # runner's libc — see the toolchain notes above.
          - name: linux-x86_64
            os: ubuntu-24.04
            cc: gcc
            linkflags: -static
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            cc: gcc
            linkflags: -static

          # ---- macOS ------------------------------------------------------
          - name: macos-x86_64
            os: macos-15-intel
            cc: clang
            linkflags: -mmacosx-version-min=11.0
          - name: macos-aarch64
            os: macos-15
            cc: clang
            linkflags: -mmacosx-version-min=11.0

          # ---- Windows (MSYS2 MinGW: the runtime is pthreads-based) --------
          - name: windows-x86_64
            os: windows-2025
            cc: gcc
            linkflags: ''
            msystem: MINGW64
            packages: >-
              mingw-w64-x86_64-gcc
              diffutils
              grep
          - name: windows-aarch64
            os: windows-11-arm
            cc: gcc
            linkflags: ''
            msystem: CLANGARM64
            packages: >-
              mingw-w64-clang-aarch64-gcc
              diffutils
              grep

    steps:
      # The tree has no .gitattributes; keep Windows checkouts byte-faithful
      # (LF as committed) so the determinism check compares like with like.
      - name: Force LF checkout (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- Toolchains ------------------------------------------------------
      # Stage 142: no Python setup on any platform — the build compiles
      # the committed C snapshot with the platform C toolchain alone.
      - name: Setup MSYS2 (MinGW gcc)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          release: true
          install: ${{ matrix.packages }}

      # ---- Cache ------------------------------------------------------------
      # bin/ holds the native compiler AND the native formatter (both
      # derived deterministically from the tree: the snapshot for hlc,
      # tools/hlfmt.hls + std/ + core/ for hlfmt). Keyed on the exact
      # content of all of it; no restore-keys (see header). The build
      # steps below also check the files themselves, so a partial cache
      # from before the formatter joined the archive self-heals.
      - name: Restore bootstrap cache
        id: bootcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: hlc-snap-${{ matrix.name }}-${{ hashFiles('snapshot/**', 'tools/hlfmt.hls', 'std/**', 'core/**') }}

      # ---- Build (Stage 142: compile the committed C snapshot) --------------
      - name: Compile the committed C snapshot (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          if [ -f bin/hlc ]; then
            echo "compiler: restored from the cache"
            exit 0
          fi
          echo "cc:     $(command -v ${{ matrix.cc }}) ($(${{ matrix.cc }} --version | head -1))"
          # Stage 142: the snapshot IS the seed — the compiler's own
          # emission for src/hlc.hls, committed to the tree. The
          # linkflags column is the distribution law: static on Linux,
          # a pinned floor on macOS (see the toolchain notes).
          ${{ matrix.cc }} -O2 ${{ matrix.linkflags }} -o bin/hlc snapshot/hlc.c -lm -pthread

      - name: Compile the committed C snapshot (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p bin
          if [ -f bin/hlc ] || [ -f bin/hlc.exe ]; then
            echo "compiler: restored from the cache"
            exit 0
          fi
          echo "cc:     $(command -v ${{ matrix.cc }}) ($(${{ matrix.cc }} --version | head -1))"
          # Stage 142: the snapshot IS the seed. MinGW gcc auto-appends
          # .exe to the output name.
          ${{ matrix.cc }} -O2 -o bin/hlc snapshot/hlc.c -lm -pthread

      # ---- Build the formatter (self-hosted: hlc compiles hlfmt.hls) --------
      # The same step `make bin/hlfmt` runs in a checkout, spelled out
      # here because the release path installs no make: the compiler
      # built one line above compiles the formatter's own HLS sources,
      # and cc links the result. Guarded on the file (not the cache
      # flag) so a cache from before this step existed fills itself.
      - name: Build the formatter (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f bin/hlfmt ]; then
            echo "formatter: restored from the cache"
            exit 0
          fi
          ./bin/hlc tools/hlfmt.hls bin/hlfmt.c
          ${{ matrix.cc }} -O2 ${{ matrix.linkflags }} -o bin/hlfmt bin/hlfmt.c -lm -pthread
          rm -f bin/hlfmt.c

      - name: Build the formatter (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [ -f bin/hlfmt ] || [ -f bin/hlfmt.exe ]; then
            echo "formatter: restored from the cache"
            exit 0
          fi
          ./bin/hlc tools/hlfmt.hls bin/hlfmt.c
          ${{ matrix.cc }} -O2 -o bin/hlfmt bin/hlfmt.c -lm -pthread
          rm -f bin/hlfmt.c

      # ---- Verify (always runs — cached or not) -----------------------------
      - name: Verify bootstrap invariant + smoke run (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          # (a) The fixed-point law: the compiler built from the committed
          #     snapshot must re-derive the snapshot byte for byte — the
          #     exact gate `make bootstrap` enforces, judged against the
          #     tree's own snapshot/hlc.c (not a cache artifact).
          ./bin/hlc src/hlc.hls smoke/hlc_selfcheck.c
          diff -q snapshot/hlc.c smoke/hlc_selfcheck.c
          # (b) Compile a real program end-to-end and run it.
          ./bin/hlc examples/hello.hls smoke/hello.c
          ${{ matrix.cc }} -O2 -o smoke/hello smoke/hello.c -lm -pthread
          out="$(./smoke/hello)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Hello, Halis!'
          # (c) The formatter answers over the same file with byte-
          #     identical output — hello.hls is kept canonical by the
          #     tree's fmt discipline, so this is the formatter's own
          #     fixed point, not a coincidence of content.
          ./bin/hlfmt examples/hello.hls > smoke/hello_fmt.hls
          diff -q examples/hello.hls smoke/hello_fmt.hls
          echo "SMOKE OK: ${{ matrix.name }}"

      - name: Verify bootstrap invariant + smoke run (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p smoke
          # (a) The fixed-point law: judged against the tree's own
          #     committed snapshot/hlc.c. MSYS2 bash resolves ./bin/hlc
          #     to bin/hlc.exe automatically.
          ./bin/hlc src/hlc.hls smoke/hlc_selfcheck.c
          diff -q snapshot/hlc.c smoke/hlc_selfcheck.c
          # (b) Compile a real program end-to-end and run it.
          ./bin/hlc examples/hello.hls smoke/hello.c
          ${{ matrix.cc }} -O2 -o smoke/hello smoke/hello.c -lm -pthread
          out="$(./smoke/hello)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Hello, Halis!'
          # (c) The formatter's fixed point over the same file.
          ./bin/hlfmt examples/hello.hls > smoke/hello_fmt.hls
          diff -q examples/hello.hls smoke/hello_fmt.hls
          echo "SMOKE OK: ${{ matrix.name }}"

      # ---- Package ------------------------------------------------------------
      # The archive IS the SDK: the two binaries, the library as source,
      # the canonical first program, the licence, the readme and the
      # version record. One archive, the whole language — the installer
      # (install.sh) unpacks exactly this layout and never builds.
      - name: Package the SDK (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          P="${{ matrix.name }}"
          R="stage/halis-${V}"
          mkdir -p "${R}/bin" "${R}/examples" dist
          cp bin/hlc bin/hlfmt "${R}/bin/"
          cp -R std core "${R}/"
          cp examples/hello.hls "${R}/examples/"
          cp LICENSE README.md "${R}/"
          printf 'version=%s\n' "${V}" > "${R}/VERSION"
          tar -C stage -czf "dist/halis-${V}-${P}.tar.gz" "halis-${V}"
          echo "Built: dist/halis-${V}-${P}.tar.gz ($(wc -c < "dist/halis-${V}-${P}.tar.gz") bytes)"

      - name: Package the SDK (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GITHUB_REF_NAME
          $p = "${{ matrix.name }}"
          $r = "stage/halis-$v"
          New-Item -ItemType Directory -Force -Path "$r/bin", "$r/examples", "dist" | Out-Null
          Copy-Item bin/hlc.exe "$r/bin/"
          Copy-Item bin/hlfmt.exe "$r/bin/"
          Copy-Item -Recurse std "$r/std"
          Copy-Item -Recurse core "$r/core"
          Copy-Item examples/hello.hls "$r/examples/"
          Copy-Item LICENSE "$r/"
          Copy-Item README.md "$r/"
          Set-Content "$r/VERSION" "version=$v"
          Compress-Archive -Path $r -DestinationPath "dist/halis-$v-$p.zip"
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ============================================================================
  # Collect, checksum, publish — tag builds only.
  # ============================================================================
  release:
    name: GitHub Release (SHA256SUMS + publish)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Detect the release channel from the tag
        id: channel
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # THE CHANNEL LAW — one rule, every suffix: a hyphen after
          # the version is a pre-release identifier, whatever word it
          # carries (-alpha, -beta, -rc.1, -nightly, -build.42, ...).
          # A bare version has no hyphen and no suffix: it is the
          # stable channel, and it is the release users are pointed
          # at (latest).
          case "${tag}" in
            *-*)
              prerelease=true
              make_latest=false
              suffix="${tag#*-}"
              channel="pre-release (-${suffix})"
              ;;
            *)
              prerelease=false
              make_latest=true
              suffix=""
              channel="stable (latest)"
              ;;
          esac
          {
            echo "prerelease=${prerelease}"
            echo "make_latest=${make_latest}"
            echo "suffix=${suffix}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"
          echo "tag ${tag} -> ${channel}"

      - name: Collect all platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            The whole Halis toolchain for `${{ github.ref_name }}` — **${{ steps.channel.outputs.channel }}**, built by the pure-HLS bootstrap (the committed C snapshot) on GitHub-hosted runners.

            **The recommended way on**: one command, no compiler, no make — the installer picks this archive for your platform, checks it against `SHA256SUMS`, and places the toolchain:

            ```
            curl -fsSL https://raw.githubusercontent.com/mhieuhonda/halis-lang/main/install.sh | sh
            ```

            (Windows: run it from an MSYS2 / Git Bash shell — see [installation.md](https://github.com/mhieuhonda/halis-lang/blob/main/installation.md).)

            **Assets** — every archive carries the complete SDK:

            | File | Platform |
            |------|----------|
            | `halis-${{ github.ref_name }}-linux-x86_64.tar.gz` | Linux x86_64 (static — any distro, glibc or musl) |
            | `halis-${{ github.ref_name }}-linux-aarch64.tar.gz` | Linux aarch64 (static — any distro, glibc or musl) |
            | `halis-${{ github.ref_name }}-macos-x86_64.tar.gz` | macOS x86_64 (Intel, macOS 11+) |
            | `halis-${{ github.ref_name }}-macos-aarch64.tar.gz` | macOS aarch64 (Apple silicon, macOS 11+) |
            | `halis-${{ github.ref_name }}-windows-x86_64.zip` | Windows x86_64 (MSYS2 / Git Bash) |
            | `halis-${{ github.ref_name }}-windows-aarch64.zip` | Windows aarch64 (MSYS2 CLANGARM64) |
            | `SHA256SUMS` | checksums for all of the above |

            Each archive holds `bin/hlc` and `bin/hlfmt` (the compiler and the formatter), `std/` and `core/` (the standard library and the freestanding runtime, as source — the form the compiler reads), `examples/hello.hls`, `LICENSE`, `README.md` and a `VERSION` record. Linux binaries are statically linked; macOS binaries target 11.0+.

            **Verify** after a manual download:

            ```
            sha256sum --check SHA256SUMS
            ```

            **Bootstrap guarantee**: every binary re-compiled `src/hlc.hls` to the byte-identical `hlc.c` the committed snapshot carries (the `make bootstrap` determinism gate, guarded since Stage 143 by the self-hosted snapshot kit) before packaging; `hlfmt` was built by that very compiler and proved byte-identical over `examples/hello.hls`. Built without libcurl — `net_tls_get` panics with a clear message; all other net builtins work.
          files: |
            dist/**

# ============================================================================
# CodeQL — static security analysis for the Python bootstrap + tooling
# (boot/, tools/, tests/ — roughly the whole non-HLS surface) and for the
# GitHub Actions workflows themselves.
# ============================================================================
#
# Runs on pushes to main and weekly (Monday 04:23 UTC). Pull-request
# analysis is intentionally left out: the main CI gate covers every PR
# and CodeQL's full build keeps the PR feedback loop slow.
# ============================================================================

name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@64d10c13136e1c5bce3e5fbde8d4906eeaafc885 # v3.30.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@64d10c13136e1c5bce3e5fbde8d4906eeaafc885 # v3.30.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@64d10c13136e1c5bce3e5fbde8d4906eeaafc885 # v3.30.6
        with:
          category: '/language:${{ matrix.language }}'

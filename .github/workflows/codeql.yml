# ============================================================================
# CodeQL — static security analysis for the Python tooling
# (tools/, tests/ — the non-HLS surface; the seed left the tree in
# v0.164.0-alpha, the interpreter lives under tools/hlinterp/) and for
# the GitHub Actions workflows themselves.
# ============================================================================
#
# Runs on pushes to main and weekly (Monday 04:23 UTC). Pull-request
# analysis is intentionally left out: the main CI gate covers every PR
# and CodeQL's full build keeps the PR feedback loop slow.
# ============================================================================

name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'

# ============================================================================
# CI — the main gate for every push and pull request.
# ============================================================================
#
# Pipeline shape (after the paths job, every job runs in parallel):
#
#   lint        — actionlint (pinned binary, checksum-verified), shellcheck
#                 at error severity, Python byte-compile of boot/ tools/
#                 tests/, hllint over the compiler + stdlib + core sources,
#                 spec-check, and on tag pushes the tag-vs-CHANGELOG gate.
#   bootstrap   — make bootstrap (Stage-0 seed -> native hlc -> the
#                 byte-identical self-compilation diff), then the full
#                 no-libc cross-bootstrap ladder, then a smoke run.
#                 bin/ is cached on the exact hash of boot/** + src/**.
#   test        — the 8 differential suites from tests/run_tests.sh run in
#                 PARALLEL via tests/run_one_suite.sh (suite_08 first builds
#                 bin/hlc + bin/hlc-fs, which it consumes directly).
#   matrix      — Python 3.8 / 3.13 (gcc) and 3.12 (clang): bootstrap, the
#                 pure-interpreter battery (suite_01) and a native smoke.
#   smoke-macos — bootstrap + smoke on the Apple-silicon runner.
#   smoke-win   — bootstrap + smoke under MSYS2 MinGW on windows-2025.
#   tools       — hltest over the ok corpus, a seeded 2-minute differential
#                 fuzz, spec-check and an LSP diagnostics smoke.
#   gate        — one aggregate verdict for branch protection ("CI gate").
#
# Docs-only changes skip every heavy job and the run finishes in the
# lint job. Tag pushes (`v*-alpha`) run the full battery; the release
# build itself lives in release.yml.
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'upgrade/**'
      - 'arena/**'
      - 'fix/**'
    tags:
      - 'v*-alpha'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # ------------------------------------------------------------------ paths --
  changes:
    name: detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'boot/**'
              - 'src/**'
              - 'std/**'
              - 'core/**'
              - 'tools/**'
              - 'tests/**'
              - 'examples/**'
              - 'benchmarks/**'
              - 'targets/**'
              - 'mk/**'
              - 'Makefile'
              - 'link.ld'

  # ------------------------------------------------------------------- lint --
  lint:
    name: lint & hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Fetch actionlint 1.7.7 (checksum-verified)
        run: |
          cd "$(mktemp -d)"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" -o actionlint_1.7.7_linux_amd64.tar.gz
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt" -o checksums.txt
          grep "  actionlint_1.7.7_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Validate workflows (actionlint)
        run: actionlint -color

      - name: Shellcheck (error severity)
        run: |
          git ls-files '*.sh' | xargs -r shellcheck --severity=error

      - name: Byte-compile all Python sources
        run: |
          python3 -m compileall -q boot tools tests

      - name: hllint over compiler + stdlib + core
        run: |
          fail=0
          for f in src/*.hls src/hlc/*.hls core/*.hls std/*.hls; do
            python3 tools/hllint.py "$f" >/dev/null 2>&1 || {
              echo "::error file=$f::hllint reported issues"
              fail=1
            }
          done
          exit "$fail"

      - name: Spec consistency (spec-check)
        run: python3 tools/hls-spec-check.py

      - name: Tag version must exist in CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME}"
          grep -q "^## \[${v}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${v}]' entry for this tag"
            exit 1
          }
          echo "CHANGELOG entry for ${v} found"

  # -------------------------------------------------------------- bootstrap --
  bootstrap:
    name: bootstrap & determinism (gcc)
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # bin/ is derived deterministically from boot/** + src/**; a hit
      # proves these exact sources were bootstrapped before.
      - name: Restore bootstrap cache
        id: bootcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: hlc-ci-gcc-x64-${{ runner.os }}-${{ hashFiles('boot/**', 'src/**') }}

      - name: Bootstrap (Stage-0 -> native hlc -> determinism diff)
        if: steps.bootcache.outputs.cache-hit != 'true'
        run: make bootstrap

      - name: Cross-bootstrap ladder (no-libc freestanding hlc)
        run: make bootstrap-nolibc

      - name: Smoke run (make run examples/hello.hls)
        run: make run F=examples/hello.hls

  # ------------------------------------------------------------ test matrix --
  test:
    name: suite ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - suite_01_boot
          - suite_02_differential
          - suite_03_selfhost
          - suite_04_optimizers
          - suite_05_backends
          - suite_06_advanced
          - suite_07_asm
          - suite_08_osdev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # suite_08 consumes bin/hlc (its --audit legs) and bin/hlc-fs (the
      # zero-libc symbol check), so it builds the full ladder itself;
      # every other suite is standalone via run_one_suite.sh.
      - name: Build native + freestanding compiler (suite_08 only)
        if: matrix.suite == 'suite_08_osdev'
        run: |
          make bootstrap
          make bootstrap-nolibc

      # suite_02's Stage-97 battery greps the z3-VERIFIED inference
      # verdicts (--infer-invariants), so the suite assumes a z3 backend
      # is present; the guarded --cvc5 / --shapes sections pick the
      # module up too. Everything else in the suite is solver-free.
      - name: Install z3 (suite_02 only)
        if: matrix.suite == 'suite_02_differential'
        run: python3 -m pip install --quiet z3-solver

      - name: Run ${{ matrix.suite }}
        run: |
          set -o pipefail
          bash tests/run_one_suite.sh tests/suites/${{ matrix.suite }}.sh 2>&1 | tee suite.log

      - name: Suite summary
        if: always()
        run: |
          line="$(grep -E '^SUITE RESULT:' suite.log 2>/dev/null | tail -1 || true)"
          {
            echo "### suite ${{ matrix.suite }}"
            echo '```'
            echo "${line:-<no result line — job failed early>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- python × cc grid --
  matrix:
    name: py ${{ matrix.py }} / ${{ matrix.cc }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - py: '3.8'
            cc: gcc
          - py: '3.8'
            cc: clang
          - py: '3.13'
            cc: gcc
          - py: '3.13'
            cc: clang
          - py: '3.12'
            cc: clang
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.py }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}

      - name: Bootstrap with ${{ matrix.cc }} (determinism diff included)
        run: make bootstrap CC=${{ matrix.cc }}

      - name: Interpreter battery (suite_01 — the Python-sensitive path)
        run: bash tests/run_one_suite.sh tests/suites/suite_01_boot.sh

      - name: Native hello smoke with ${{ matrix.cc }}
        run: |
          set -euo pipefail
          mkdir -p smoke
          ./bin/hlc examples/hello.hls smoke/hello.c
          ${{ matrix.cc }} -O2 -o smoke/hello smoke/hello.c -lm -pthread
          out="$(./smoke/hello)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Hello, Halis!'

  # -------------------------------------------------------------- macos arm --
  smoke-macos:
    name: smoke macos (arm64, clang)
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Bootstrap
        run: make bootstrap

      - name: Native hello smoke
        run: |
          set -euo pipefail
          mkdir -p smoke
          ./bin/hlc examples/hello.hls smoke/hello.c
          clang -O2 -o smoke/hello smoke/hello.c -lm -pthread
          out="$(./smoke/hello)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Hello, Halis!'

  # ------------------------------------------------------------- windows x64 --
  smoke-windows:
    name: smoke windows (x64, MSYS2 MinGW)
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Force LF checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSYS2 (MinGW gcc + msys make/python)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          release: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            python
            diffutils
            grep

      - name: Bootstrap
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make bootstrap

      - name: Native hello smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p smoke
          ./bin/hlc examples/hello.hls smoke/hello.c
          gcc -O2 -o smoke/hello smoke/hello.c -lm -pthread
          out="$(./smoke/hello)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Hello, Halis!'

  # ------------------------------------------------------------------ tools --
  tools:
    name: tooling & fuzz smoke
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: HLS test framework (hltest over the ok corpus)
        run: |
          mkdir -p /tmp/hls_session_test
          rm -f /tmp/hls_session_test/*.sess 2>/dev/null || true
          python3 tools/hltest.py -r tests/ok

      - name: Differential fuzz smoke (seeded, 2 minutes)
        run: python3 tools/hls-fuzz.py --time 120 --seed 20260101

      - name: LSP diagnostics smoke
        run: python3 tools/hls-lsp.py --check tests/ok/feat_map.hls

  # ------------------------------------------------------------------- gate --
  gate:
    name: CI gate
    needs:
      - lint
      - bootstrap
      - test
      - matrix
      - smoke-macos
      - smoke-windows
      - tools
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate verdict
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          names="lint bootstrap test matrix smoke-macos smoke-windows tools"
          echo "job results: ${results}"
          {
            echo "## CI verdict"
            echo
            echo '| job | result |'
            echo '|-----|--------|'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          read -r -a n_arr <<< "${names}"
          read -r -a r_arr <<< "${results}"
          for i in "${!n_arr[@]}"; do
            r="${r_arr[$i]:-missing}"
            echo "| ${n_arr[$i]} | ${r} |" >> "$GITHUB_STEP_SUMMARY"
            case "${r}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "${failed}" -ne 0 ]; then
            echo '**CI FAILED** — see the failed jobs above.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'All CI jobs green.' >> "$GITHUB_STEP_SUMMARY"

# ============================================================================
# CI — Hieu Louis (HLS)
# ----------------------------------------------------------------------------
# Runs the full test suite on every push and pull request. The suite covers:
#   1. Stage-0 ok programs (interpreter)
#   2. Stage-0 fail programs (must be rejected)
#   3. Self-compile + differential testing (interpreter vs native)
#   4. Bootstrap fixed-point (deterministic self-compilation)
# ----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: make test (Python ${{ matrix.python }}, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
        cc:    ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Select C compiler
        run: |
          if [ "${{ matrix.cc }}" = "clang" ]; then
            sudo apt-get update -y && sudo apt-get install -y clang
          fi
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          python3 --version
          ${CC} --version
          make --version | head -1

      - name: Run the full test suite
        run: make test

      - name: Verify bootstrap determinism
        run: make bootstrap

      - name: Run example programs
        run: |
          # Most examples exit 0. A few deliberately panic to demonstrate
          # the safe-panic semantics — we capture their exit code and
          # accept 0 OR 101 (the panic exit code) for those.
          for f in examples/hello.hls examples/fibonacci.hls examples/primes.hls \
                   examples/enum_demo.hls \
                   examples/option_demo.hls examples/result_demo.hls \
                   examples/ownership_demo.hls examples/effects_demo.hls \
                   examples/hex_demo.hls examples/base64_demo.hls \
                   examples/crypto_demo.hls examples/csv_demo.hls \
                   examples/list_demo.hls examples/time_demo.hls \
                   examples/uuid_demo.hls examples/web_demo.hls \
                   examples/stdlib_demo.hls examples/taint_demo.hls; do
            echo "--- $f"
            python3 boot/boot.py "$f"
          done
          # secure_demo.hls deliberately triggers an integer-overflow panic
          # to demonstrate the safe-panic semantics. Capture its exit code;
          # accept 0 (clean) or 101 (safe panic).
          echo "--- examples/secure_demo.hls (deliberately panics on overflow)"
          python3 boot/boot.py examples/secure_demo.hls; rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "101" ]; then
            echo "secure_demo.hls failed with unexpected exit code $rc"
            exit 1
          fi
          echo "--- examples/wordcount.hls (with data file)"
          python3 boot/boot.py examples/wordcount.hls examples/data.txt

      - name: Audit a sample program (--audit flag, Stage 9-beta)
        run: make audit F=examples/effects_demo.hls

      - name: Run stdlib benchmarks (smoke)
        run: |
          python3 boot/boot.py benchmarks/sieve.hls
          python3 boot/boot.py benchmarks/json_bench.hls
          python3 boot/boot.py benchmarks/crypto_bench.hls

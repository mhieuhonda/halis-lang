# ============================================================================
# CI — Halis (HLS)
# ----------------------------------------------------------------------------
# Runs the full test suite on every push and pull request. The suite covers:
#   1. Stage-0 ok programs (interpreter)
#   2. Stage-0 fail programs (must be rejected)
#   3. Self-compile + differential testing (interpreter vs native)
#   4. Bootstrap fixed-point (deterministic self-compilation)
# ----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: make test (Python ${{ matrix.python }}, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
        cc:    ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Select C compiler
        run: |
          if [ "${{ matrix.cc }}" = "clang" ]; then
            sudo apt-get update -y && sudo apt-get install -y clang
          fi
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          python3 --version
          ${CC} --version
          make --version | head -1

      - name: Run the full test suite
        run: make test

      - name: Verify bootstrap determinism
        run: make bootstrap

      - name: Run example programs
        run: |
          # Most examples exit 0. A few deliberately panic to demonstrate
          # the safe-panic semantics — we capture their exit code and
          # accept 0 OR 101 (the panic exit code) for those.
          # NOTE: taint_beta_demo.hls and wordcount.hls need a data-file
          # argument and are run separately below.
          for f in examples/hello.hls examples/fibonacci.hls examples/primes.hls \
                   examples/enum_demo.hls \
                   examples/option_demo.hls examples/result_demo.hls \
                   examples/ownership_demo.hls examples/effects_demo.hls \
                   examples/hex_demo.hls examples/base64_demo.hls \
                   examples/crypto_demo.hls examples/csv_demo.hls \
                   examples/list_demo.hls examples/time_demo.hls \
                   examples/uuid_demo.hls examples/web_demo.hls \
                   examples/stdlib_demo.hls examples/taint_demo.hls \
                   examples/ffi_demo.hls examples/optimize_demo.hls \
                   examples/llvm_demo.hls examples/tooling_demo.hls \
                   examples/pkg_demo.hls examples/libcurl_demo.hls \
                   examples/conc_demo.hls examples/actor_demo.hls \
                   examples/bounded_chan_demo.hls examples/conc_pipeline.hls \
                   examples/par_scan.hls examples/hmac_proven.hls \
                   examples/proof_demo.hls \
                   examples/conn_machine.hls; do
            echo "--- $f"
            python3 boot/boot.py "$f" || exit 1
          done
          # secure_demo.hls deliberately triggers an integer-overflow panic
          # to demonstrate the safe-panic semantics. Capture its exit code;
          # accept 0 (clean) or 101 (safe panic). The `|| true` prevents
          # bash -e from aborting the step on the non-zero exit code.
          echo "--- examples/secure_demo.hls (deliberately panics on overflow)"
          rc=0
          python3 boot/boot.py examples/secure_demo.hls || rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "101" ]; then
            echo "secure_demo.hls failed with unexpected exit code $rc"
            exit 1
          fi
          echo "--- examples/wordcount.hls (with data file)"
          python3 boot/boot.py examples/wordcount.hls examples/data.txt
          echo "--- examples/taint_beta_demo.hls (with data file)"
          python3 boot/boot.py examples/taint_beta_demo.hls examples/data.txt

      - name: Audit a sample program (--audit flag, Stage 9-beta)
        run: make audit F=examples/effects_demo.hls

      - name: Test Stage 11 IR emitter (--emit ir, --opt-stats)
        run: |
          python3 boot/boot.py --emit ir examples/fibonacci.hls > /dev/null
          python3 boot/boot.py --opt-stats examples/fibonacci.hls > /dev/null

      - name: Test Stage 12 LLVM IR emitter (--emit llvm)
        run: |
          python3 boot/boot.py --emit llvm examples/hello.hls > /dev/null
          python3 boot/boot.py --emit llvm --target x86_64-linux examples/fibonacci.hls > /dev/null

      - name: LLVM IR backend suite (emit + structural validation)
        run: |
          # v0.16.0-alpha: the old CI only piped --emit llvm output to
          # /dev/null — the emitter shipped invalid IR (i1/i64 boolean
          # mixups, instructions after terminators, undefined runtime
          # symbols) while every scan reported green. This suite emits,
          # validates the IR structurally (tools/ll_validate.py), and
          # checks the supported subset's behaviour.
          bash tests/run_llvm_tests.sh

      - name: LLVM IR assembler cross-check (if available)
        run: |
          # When llvm-as is installable, assemble the emitted IR with the
          # REAL LLVM parser as an extra guard (best-effort).
          if command -v llvm-as >/dev/null 2>&1 || sudo apt-get install -y -q llvm >/dev/null 2>&1; then
            for f in tests/llvm/*.hls; do
              name=$(basename "$f" .hls)
              python3 boot/boot.py --emit llvm "$f" > "/tmp/$name.ll"
              llvm-as "/tmp/$name.ll" -o "/tmp/$name.bc"
            done
            echo "llvm-as assembled all tests/llvm programs"
          else
            echo "llvm-as not available; skipped (structural validator already ran)"
          fi

      - name: Test Stage 14 tooling (hlfmt, hllint, hls-lsp)
        run: |
          # Formatter: idempotency check on comment-free files.
          python3 tools/hlfmt.py -c examples/hello.hls || true  # comments not preserved (alpha)
          # v0.16.0-alpha: float literals must survive formatting (the old
          # formatter rewrote 0.00001 as 1e-05, which the lexer cannot
          # re-parse — hlfmt -w corrupted files).
          printf 'fn main() -> int {\n    let eps: float = 0.00001\n    let big: float = 10000000000000000.0\n    return eps.to_int()\n}\n' > /tmp/floatfmt.hls
          python3 tools/hlfmt.py /tmp/floatfmt.hls > /tmp/floatfmt1.hls
          python3 tools/hlfmt.py /tmp/floatfmt1.hls > /tmp/floatfmt2.hls
          diff /tmp/floatfmt1.hls /tmp/floatfmt2.hls
          python3 boot/boot.py --check /tmp/floatfmt1.hls
          # Linter: run on all source files (warnings are OK, exit 0).
          python3 tools/hllint.py --list
          python3 tools/hllint.py examples/fibonacci.hls
          # LSP: one-shot check mode.
          python3 tools/hls-lsp.py --check examples/hello.hls
          # LSP: malformed-frame resilience + hover on broken doc (a single
          # bad frame used to kill the server; hover on a syntax-error doc
          # used to crash with KeyError and never answer the request).
          python3 tools/lsp_smoke.py

      - name: Test Stage 13 package manager (hls-pkg)
        run: |
          python3 tools/hls-pkg.py --help
          python3 tools/hls-pkg.py --list 2>/dev/null || true

      - name: Test Stage 15 bindgen (hlbindgen)
        run: |
          echo 'int abs(int n); size_t strlen(const char* s);' > /tmp/test.h
          python3 tools/hlbindgen.py /tmp/test.h
          # v0.16.0-alpha: return-type parsing and C array parameters
          # (char* ch(char* s); used to map ch's return to int because the
          # name matched inside "char"; char buf[] leaked brackets into the
          # parameter name).
          printf 'char* ch(char* s);\nconst char* cons(const char* s);\nvoid draw(char buf[], int pts[10]);\n' > /tmp/test2.h
          python3 tools/hlbindgen.py /tmp/test2.h > /tmp/test2.hls
          # NOTE: grep -F (fixed-string) — GitHub runners do not ship rg,
          # and the patterns contain regex-significant characters.
          grep -qF 'fn ch(s: str) -> str' /tmp/test2.hls
          grep -qF 'fn cons(s: str) -> str' /tmp/test2.hls
          grep -qF 'fn draw(buf: str, pts: int) -> void' /tmp/test2.hls

      - name: Run stdlib benchmarks (smoke)
        run: |
          python3 boot/boot.py benchmarks/sieve.hls
          python3 boot/boot.py benchmarks/json_bench.hls
          python3 boot/boot.py benchmarks/crypto_bench.hls

      - name: Test Stage 19 PGO (profile-guided optimisation)
        run: |
          # Full training cycle on the native compiler: instrument,
          # train on the self-compilation workload, recompile with
          # --pgo-use, and verify byte-identical output. The timing
          # ratio is reported (informational on shared runners; the
          # gated acceptance is `make pgo-acceptance`, verified on the
          # release path and documented in CHANGELOG.md).
          make pgo
          make pgo-report || true

      - name: Test Stage 21 SIMD (std.simd + target features)
        run: |
          # The full suite (make test) covers the differential semantics;
          # this step additionally drives the intrinsic fast path and
          # the acceptance benchmark on the x86-64 runner (2x gate on
          # AVX2 hosts, checksum-gated everywhere).
          make simd-acceptance

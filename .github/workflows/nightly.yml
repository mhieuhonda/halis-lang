# ============================================================================
# Nightly — the deep battery that is too slow (or too flaky on shared
# runners) for the per-push CI, plus auto-filed issues when it fails.
# ============================================================================
#
# Schedule: 18:17 UTC every day (01:17 the next morning, UTC+7).
#
# The deep job runs, in order:
#   1. make bootstrap            — the full determinism gate
#   2. make test                 — the canonical 8-suite battery, sequential
#   3. 30-minute differential fuzz run
#   4. SMT proving               — cvc5 + z3 via the pip modules
#   5. cross-triple gates        — aarch64 / riscv64 cross-gcc, QEMU boots
#                                  when the emulator is present
#   6. deterministic gates       — size / memory / api-freeze acceptance
#   7. hltest with a JUnit report + the benchmark sweep, as artifacts
#   8. advisory timing gates     — perf + constant-time acceptance
#                                  (continue-on-error: they measure wall
#                                  time on shared runners)
#
# On a scheduled failure the issue job opens (or comments on) a single
# issue labelled `nightly-failure` with the run link. Successful nights
# stay silent.
# ============================================================================

name: Nightly

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  deep:
    name: deep battery
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install SMT backends (cvc5, z3) and cross toolchains
        run: |
          python3 -m pip install --quiet cvc5 z3-solver
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            qemu-system-arm qemu-system-misc

      - name: Bootstrap
        run: make bootstrap

      - name: Full test battery (make test)
        run: bash tests/run_tests.sh 2>&1 | tee full_test.log

      - name: Differential fuzz (30 minutes)
        run: python3 tools/hls-fuzz.py --time 1800

      - name: SMT proving acceptance (cvc5 + z3)
        run: make cvc5-acceptance

      - name: Cross-triple gates (x86_64 / aarch64 / riscv64)
        run: |
          make triple-x86_64-acceptance
          make triple-aarch64-acceptance
          make triple-riscv64-acceptance

      - name: Deterministic gates (size / memory / api freeze)
        run: |
          make size-acceptance
          make mem-acceptance
          make freeze-acceptance

      - name: HLS test framework with JUnit report
        run: |
          mkdir -p /tmp/hls_session_test
          rm -f /tmp/hls_session_test/*.sess 2>/dev/null || true
          python3 tools/hltest.py -r tests/ok --junit hltest-junit.xml

      - name: Benchmark sweep
        run: |
          bash benchmarks/run_bench.sh 2>&1 | tee bench.log || true
          tail -30 bench.log

      # Timing-sensitive gates: advisory on shared runners.
      - name: Perf acceptance (advisory)
        continue-on-error: true
        run: make perf-acceptance

      - name: Constant-time acceptance (advisory)
        continue-on-error: true
        run: make ctime-acceptance

      - name: Upload artifacts (JUnit, logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-artifacts
          retention-days: 14
          if-no-files-found: ignore
          path: |
            hltest-junit.xml
            full_test.log
            bench.log

  # ---------------------------------------------------------------------------
  # One issue per broken night — deduped by title, labelled nightly-failure.
  # ---------------------------------------------------------------------------
  issue:
    name: file nightly failure issue
    needs: deep
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure the nightly-failure label exists
        run: |
          gh label create nightly-failure --repo "${{ github.repository }}" \
            --color D93F0B --description "A scheduled nightly run failed" 2>/dev/null || true

      - name: Open or comment on the failure issue
        run: |
          title="nightly deep battery failed $(date -u +%F)"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled nightly run failed.
          Run: ${run_url}
          Commit: ${{ github.sha }}
          See the failed jobs in the run above; artifacts carry the logs."
          existing="$(gh issue list --repo "${{ github.repository }}" \
            --label nightly-failure --state open --limit 1 --json number \
            --search "in:title ${title}" --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${{ github.repository }}" --body "${body}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "${title}" --label nightly-failure --body "${body}"
          fi
